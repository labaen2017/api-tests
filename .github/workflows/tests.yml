name: API tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run smoke tests
        if: github.event_name == 'push'
        run: pytest -v -m smoke

      - name: Run all tests
        if: github.event_name != 'push'
        run: pytest -v