name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jsonplaceholder.typicode.com

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run smoke tests
        if: github.event_name == 'push'
        run: pytest -v -m smoke --html=report.html --self-contained-html

      - name: Run all tests
        if: github.event_name != 'push'
        run: pytest -v --html=report.html --self-contained-html

      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html